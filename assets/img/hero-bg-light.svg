<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="">
  <!-- Variante clara del fondo generativo. Misma composición y animación
       que hero-bg.svg (mismas posiciones, escalas y demoras de caída);
       sólo cambia la paleta para que funcione sobre un fondo claro. -->
  <style>
    @keyframes aba-fall {
      0%   { transform: translateY(-160px); opacity: 0; }
      8%   { opacity: 1; }
      92%  { opacity: 1; }
      100% { transform: translateY(1160px); opacity: 0; }
    }
    .fall { animation: aba-fall 15s linear infinite; }
    @media (prefers-reduced-motion: reduce) {
      .fall { animation: none; transform: none; opacity: 1; }
    }
  </style>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#FBF8F3"/>
      <stop offset="78%" stop-color="#F2ECE1"/>
      <stop offset="100%" stop-color="#EAE2D3"/>
    </linearGradient>

    <radialGradient id="glowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D93628" stop-opacity=".22"/>
      <stop offset="60%" stop-color="#D93628" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#D93628" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowPale" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3D4B4D" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#3D4B4D" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="50%" cy="46%" r="72%">
      <stop offset="55%" stop-color="#3D4B4D" stop-opacity="0"/>
      <stop offset="100%" stop-color="#3D4B4D" stop-opacity=".16"/>
    </radialGradient>

    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
        values="0 0 0 0 0.5
                0 0 0 0 0.5
                0 0 0 0 0.5
                0 0 0 .06 0"/>
    </filter>

    <g id="s-spade"><path d="M12 1.5C12 1.5 3.4 8.8 3.4 14.1a4.2 4.2 0 0 0 7.3 2.9c-.1 2.2-1 4.2-2.2 5.5h7a9.6 9.6 0 0 1-2.2-5.5 4.2 4.2 0 0 0 7.3-2.9c0-5.3-8.6-12.6-8.6-12.6z"/></g>
    <g id="s-heart"><path d="M12 21.6S2.6 14.4 2.6 8.6a4.7 4.7 0 0 1 9.4-1.9 4.7 4.7 0 0 1 9.4 1.9c0 5.8-9.4 13-9.4 13z"/></g>
    <g id="s-diamond"><path d="M12 1.6 21.4 12 12 22.4 2.6 12z"/></g>
    <g id="s-club"><path d="M12 1.6a4.3 4.3 0 0 1 3.1 7.3 4.3 4.3 0 1 1-1.4 7.6c.1 2.3 1 4.4 2.2 5.9H8.1c1.2-1.5 2.1-3.6 2.2-5.9a4.3 4.3 0 1 1-1.4-7.6A4.3 4.3 0 0 1 12 1.6z"/></g>
  </defs>

  <rect width="1600" height="1000" fill="url(#bgGrad)"/>
  <circle cx="1220" cy="120" r="520" fill="url(#glowRed)"/>
  <circle cx="120" cy="920" r="560" fill="url(#glowPale)"/>

  <!-- Los cuatro palos: mismas posiciones, escalas y demoras que la
       variante oscura, recoloreados para leerse sobre fondo claro. -->
  <g fill="#1E2E31"> <!-- picas: pizarra más profunda, con más presencia que un gris lavado -->
    <g class="fall" style="animation-delay:-.5s"><use href="#s-spade" transform="translate(150,120) scale(3.6) rotate(-12)" opacity=".16"/></g>
    <g class="fall" style="animation-delay:-3.8s"><use href="#s-spade" transform="translate(1240,760) scale(3.2) rotate(8)" opacity=".14"/></g>
    <g class="fall" style="animation-delay:-7.2s"><use href="#s-spade" transform="translate(980,80) scale(2.4) rotate(30)" opacity=".12"/></g>
    <g class="fall" style="animation-delay:-10.6s"><use href="#s-spade" transform="translate(650,900) scale(2.8) rotate(-22)" opacity=".14"/></g>
    <g class="fall" style="animation-delay:-13.1s"><use href="#s-spade" transform="translate(1500,300) scale(2.2) rotate(15)" opacity=".12"/></g>
    <g class="fall" style="animation-delay:-1.9s"><use href="#s-spade" transform="translate(30,700) scale(2)" opacity=".11"/></g>
  </g>
  <g fill="#E2301C"> <!-- corazones: rojo de marca, más saturado -->
    <g class="fall" style="animation-delay:-2.4s"><use href="#s-heart" transform="translate(400,760) scale(4) rotate(-10)" opacity=".18"/></g>
    <g class="fall" style="animation-delay:-6.1s"><use href="#s-heart" transform="translate(1120,900) scale(2.4) rotate(20)" opacity=".13"/></g>
    <g class="fall" style="animation-delay:-9.4s"><use href="#s-heart" transform="translate(80,300) scale(2)" opacity=".12"/></g>
    <g class="fall" style="animation-delay:-12.7s"><use href="#s-heart" transform="translate(1500,860) scale(2.6) rotate(-14)" opacity=".14"/></g>
    <g class="fall" style="animation-delay:-4.9s"><use href="#s-heart" transform="translate(760,40) scale(2.1) rotate(9)" opacity=".11"/></g>
  </g>
  <g fill="#16965A"> <!-- tréboles: verde más vívido -->
    <g class="fall" style="animation-delay:-.9s"><use href="#s-club" transform="translate(1360,140) scale(4.2) rotate(18)" opacity=".14"/></g>
    <g class="fall" style="animation-delay:-5.3s"><use href="#s-club" transform="translate(210,820) scale(3.8) rotate(-20)" opacity=".14"/></g>
    <g class="fall" style="animation-delay:-8.6s"><use href="#s-club" transform="translate(60,540) scale(2.6) rotate(-8)" opacity=".11"/></g>
    <g class="fall" style="animation-delay:-11.8s"><use href="#s-club" transform="translate(1080,620) scale(2.3) rotate(24)" opacity=".12"/></g>
    <g class="fall" style="animation-delay:-3.1s"><use href="#s-club" transform="translate(430,260) scale(2)" opacity=".11"/></g>
  </g>
  <g fill="#E67A16"> <!-- diamantes: naranja más vívido -->
    <g class="fall" style="animation-delay:-1.6s"><use href="#s-diamond" transform="translate(1460,540) scale(3.4) rotate(14)" opacity=".19"/></g>
    <g class="fall" style="animation-delay:-4.6s"><use href="#s-diamond" transform="translate(520,180) scale(2.2) rotate(-16)" opacity=".14"/></g>
    <g class="fall" style="animation-delay:-7.8s"><use href="#s-diamond" transform="translate(1300,940) scale(2.4) rotate(10)" opacity=".13"/></g>
    <g class="fall" style="animation-delay:-10.1s"><use href="#s-diamond" transform="translate(160,420) scale(2)" opacity=".11"/></g>
    <g class="fall" style="animation-delay:-13.9s"><use href="#s-diamond" transform="translate(900,940) scale(2.2) rotate(-8)" opacity=".12"/></g>
  </g>

  <!-- Líneas finas, como los ejes de una mesa de juego -->
  <g stroke="#3D4B4D" stroke-opacity=".08" stroke-width="1">
    <line x1="0" y1="500" x2="1600" y2="500"/>
    <line x1="940" y1="0" x2="940" y2="1000"/>
  </g>

  <rect width="1600" height="1000" filter="url(#grain)" opacity=".4" style="mix-blend-mode:multiply"/>
  <rect width="1600" height="1000" fill="url(#vignette)"/>
</svg>
